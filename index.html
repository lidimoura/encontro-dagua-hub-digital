  <!-- ══ SW KILL SWITCH — V6.8: purga caches fantasmas antes do React ───────────── -->
  <!-- Roda imediatamente, antes de qualquer JS do bundle. Garante que a cliente -->
  <!-- nunca veja o bundle antigo mesmo que o SW antigo esteja instalado.         -->
  <script>
    (function killSWCache() {
      // Unregistra TODOS os Service Workers registrados
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            reg.unregister();
            console.log('[SW-KILL] Unregistered:', reg.scope);
          });
        });
      }
      // Purga TODOS os caches do CacheStorage
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key);
            console.log('[CACHE-KILL] Deleted cache:', key);
          });
        });
      }
    })();
  </script>
